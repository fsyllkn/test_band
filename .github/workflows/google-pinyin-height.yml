name: google-pinyin-height

on:
  push:
    branches: [tmp/google-pinyin-height]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download APK and apktool 2.9.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/APK/com.google.android.inputmethod.pinyin?versionCode=4520313' \
            -o google-pinyin.apk
          curl -L --fail \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar' \
            -o apktool.jar
          unzip -t google-pinyin.apk >/dev/null
          sha256sum google-pinyin.apk | tee original-sha256.txt

      - name: Decode and patch only keyboard height arrays
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f google-pinyin.apk -o decoded
          python3 - <<'PY'
          from pathlib import Path
          p = Path('decoded/res/values/arrays.xml')
          s = p.read_text(encoding='utf-8')

          entries = '''    <string-array name="entries_keyboard_height_ratio">
                  <item>@string/kb_height_short</item>
                  <item>@string/kb_height_midshort</item>
                  <item>@string/kb_height_normal</item>
                  <item>@string/kb_height_midtall</item>
                  <item>@string/kb_height_tall</item>
                  <item>120%</item>
                  <item>125%</item>
                  <item>130%</item>
                  <item>135%</item>
                  <item>140%</item>
                  <item>145%</item>
                  <item>150%</item>
                  <item>155%</item>
              </string-array>'''
          values = '''    <string-array name="entryvalues_keyboard_height_ratio">
                  <item>0.9</item>
                  <item>0.95</item>
                  <item>1.0</item>
                  <item>1.05</item>
                  <item>1.1</item>
                  <item>1.32</item>
                  <item>1.375</item>
                  <item>1.43</item>
                  <item>1.485</item>
                  <item>1.54</item>
                  <item>1.595</item>
                  <item>1.65</item>
                  <item>1.705</item>
              </string-array>'''

          def repl(text, name, replacement):
              a = text.index(f'    <string-array name="{name}">')
              b = text.index('    </string-array>', a) + len('    </string-array>')
              return text[:a] + replacement + text[b:]

          s = repl(s, 'entries_keyboard_height_ratio', entries)
          s = repl(s, 'entryvalues_keyboard_height_ratio', values)
          p.write_text(s, encoding='utf-8')

          q = Path('decoded/res/values-zh/strings.xml')
          if q.exists():
              t = q.read_text(encoding='utf-8')
              t = t.replace('<string name="kb_height_tall">高</string>', '<string name="kb_height_tall">高（100%）</string>')
              q.write_text(t, encoding='utf-8')
          PY

      - name: Rebuild with legacy AAPT1
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar b --use-aapt1 decoded -o google-pinyin-height-unsigned.apk

      - name: Align, sign and verify
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS/zipalign" -f -p 4 google-pinyin-height-unsigned.apk google-pinyin-height-aligned.apk
          keytool -genkeypair -noprompt -keystore height-mod.jks -storepass android -keypass android \
            -alias heightmod -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Google Pinyin Height Mod, OU=Local Build, O=Local Build, L=Local, S=Local, C=US'
          "$BUILD_TOOLS/apksigner" sign --ks height-mod.jks --ks-key-alias heightmod \
            --ks-pass pass:android --key-pass pass:android \
            --out google-pinyin-4.5.2-height-presets.apk google-pinyin-height-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs google-pinyin-4.5.2-height-presets.apk | tee signature.txt
          "$BUILD_TOOLS/aapt" dump badging google-pinyin-4.5.2-height-presets.apk | head -n 25 | tee badging.txt
          sha256sum google-pinyin-4.5.2-height-presets.apk | tee modified-sha256.txt

      - name: Re-decode final APK and verify height values
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f google-pinyin-4.5.2-height-presets.apk -o verify-decoded
          python3 - <<'PY'
          from pathlib import Path
          s = Path('verify-decoded/res/values/arrays.xml').read_text(encoding='utf-8')
          expected = ['<item>120%</item>', '<item>125%</item>', '<item>130%</item>', '<item>135%</item>', '<item>140%</item>', '<item>145%</item>', '<item>150%</item>', '<item>155%</item>', '<item>1.32</item>', '<item>1.375</item>', '<item>1.43</item>', '<item>1.485</item>', '<item>1.54</item>', '<item>1.595</item>', '<item>1.65</item>', '<item>1.705</item>']
          missing = [x for x in expected if x not in s]
          assert not missing, missing
          print('All added height presets verified in final APK.')
          PY

      - name: Build notes
        shell: bash
        run: |
          cat > BUILD-NOTES.txt <<'EOF'
          Google Pinyin Input 4.5.2.193126728 height preset mod
          Legacy Tall (1.10) is treated as 100%.
          Added: 120%=1.320, 125%=1.375, 130%=1.430, 135%=1.485,
                 140%=1.540, 145%=1.595, 150%=1.650, 155%=1.705.
          Re-signed with a local build key; it cannot update the official Google-signed APK in place.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: google-pinyin-4.5.2-height-presets
          retention-days: 7
          if-no-files-found: error
          path: |
            google-pinyin-4.5.2-height-presets.apk
            BUILD-NOTES.txt
            original-sha256.txt
            modified-sha256.txt
            badging.txt
            signature.txt
