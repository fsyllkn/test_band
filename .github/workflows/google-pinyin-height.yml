name: google-pinyin-height

on:
  push:
    branches: [tmp/google-pinyin-height]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download APK and apktool 2.9.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/APK/com.google.android.inputmethod.pinyin?versionCode=4520313' \
            -o google-pinyin.apk
          curl -L --fail \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar' \
            -o apktool.jar
          unzip -t google-pinyin.apk >/dev/null
          sha256sum google-pinyin.apk | tee original-sha256.txt

      - name: Decode and patch UI v2
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f google-pinyin.apk -o decoded
          python3 scripts/patch_google_pinyin_ui_v2.py

      - name: Rebuild with legacy AAPT1
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar b --use-aapt1 decoded -o google-pinyin-ui-v2-unsigned.apk

      - name: Align sign and verify
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS/zipalign" -f -p 4 google-pinyin-ui-v2-unsigned.apk google-pinyin-ui-v2-aligned.apk
          keytool -genkeypair -noprompt -keystore ui-v2.jks -storepass android -keypass android \
            -alias uiv2 -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Google Pinyin UI V2, OU=Local Build, O=Local Build, L=Local, S=Local, C=US'
          "$BUILD_TOOLS/apksigner" sign --ks ui-v2.jks --ks-key-alias uiv2 \
            --ks-pass pass:android --key-pass pass:android \
            --out google-pinyin-4.5.2-ui-v2.apk google-pinyin-ui-v2-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs google-pinyin-4.5.2-ui-v2.apk | tee signature.txt
          "$BUILD_TOOLS/aapt" dump badging google-pinyin-4.5.2-ui-v2.apk | head -n 25 | tee badging.txt
          sha256sum google-pinyin-4.5.2-ui-v2.apk | tee modified-sha256.txt

      - name: Re-decode final APK and verify resources
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f google-pinyin-4.5.2-ui-v2.apk -o verify-decoded
          python3 - <<'PY'
          from pathlib import Path
          arrays = Path('verify-decoded/res/values/arrays.xml').read_text(encoding='utf-8')
          assert '<item>155%</item>' in arrays and '<item>1.705</item>' in arrays
          lower = Path('verify-decoded/res/layout/softkey_qwerty_label_character_label_footer_lowercase.xml').read_text(encoding='utf-8')
          assert 'android:textSize="29.0dip"' in lower
          dims = Path('verify-decoded/res/values/dimens.xml').read_text(encoding='utf-8')
          assert '<dimen name="text_size_candidate">25.0dip</dimen>' in dims
          popup = Path('verify-decoded/res/layout/popup_bubble_keypreview_material.xml').read_text(encoding='utf-8')
          assert 'android:textSize="36.5dip"' in popup and 'android:minWidth="56.0dip"' in popup
          for rel in ['softkeys_input_en_qwerty.xml', 'softkeys_input_zh_pinyin_qwerty.xml']:
              x = Path('verify-decoded/res/xml', rel).read_text(encoding='utf-8')
              assert '@layout/softkey_qwerty_label_character_label_footer_lowercase' in x
              assert '@layout/popup_bubble_keypreview_material' in x
          header = Path('verify-decoded/res/layout/keyboard_prime_header_inner.xml').read_text(encoding='utf-8')
          assert 'key_pos_header_clipboard' in header and 'key_pos_header_settings' in header
          print('Final resource verification passed.')
          PY

      - name: Build notes
        shell: bash
        run: |
          cat > BUILD-NOTES.txt <<'EOF'
          Google Pinyin Input 4.5.2 UI v2 test
          - Height presets preserved: Tall=100%, plus 120%-155%.
          - Chinese + English lowercase QWERTY: 29dp portrait / 25dp landscape.
          - Uppercase remains stock.
          - Candidate words: 21dp -> 25dp.
          - Key press preview: 28dp -> 36.5dp; dedicated minimum width 56dp.
          - Toolbar adds Settings and Clipboard/Edit shortcuts.
          - Clipboard/Edit opens built-in Select/Copy/Cut/Paste panel; this app has no clipboard history.
          - APK is re-signed with a local test key.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: google-pinyin-4.5.2-ui-v2
          retention-days: 7
          if-no-files-found: error
          path: |
            google-pinyin-4.5.2-ui-v2.apk
            BUILD-NOTES.txt
            original-sha256.txt
            modified-sha256.txt
            badging.txt
            signature.txt
